<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>포트폴리오 화면 검증</title><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font:16px system-ui;background:#e4e9f0;margin:20px;color:#172b40}header{display:flex;gap:12px;align-items:center;margin-bottom:20px}button{font:inherit;padding:8px 15px}iframe{display:block;border:1px solid #90a3b5;background:white;max-width:100%}</style></head><body><header><strong>화면 폭 검증</strong><button data-width="390">모바일 390</button><button data-width="768">태블릿 768</button><button data-width="1440">데스크톱 1440</button><button id="text-size">글자 200%</button><span id="width">390 px</span></header><iframe id="preview" src="../" title="포트폴리오 검증 화면" width="390" height="900"></iframe><script>document.querySelectorAll('[data-width]').forEach(b=>b.onclick=()=>{document.getElementById('preview').width=b.dataset.width;document.getElementById('width').textContent=b.dataset.width+' px'});document.getElementById('text-size').onclick=()=>{const doc=document.getElementById('preview').contentDocument,large=doc.documentElement.style.fontSize==='32px';doc.documentElement.style.fontSize=large?'16px':'32px';document.getElementById('text-size').textContent=large?'글자 200%':'글자 100%'};</script></body></html>
